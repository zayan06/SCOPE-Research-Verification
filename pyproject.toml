[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopecheck"
version = "0.1.0"
description = "Local-first research prototype for scope-aware claim-evidence alignment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "pydantic>=2.6,<3", "uvicorn>=0.27,<1", "sqlalchemy>=2,<3", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
ingestion = ["docling>=2,<3"]
retrieval = ["scikit-learn>=1.4,<2", "sentence-transformers>=3,<6"]
database = ["psycopg[binary]>=3.1,<4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
